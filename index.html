<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/image/golden-tran-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title class="title">QR Diner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
<script>
  const user = localStorage.getItem('user');
  const parsedUser = user ? JSON.parse(user) : null;

  const hotelname = parsedUser?.hotelName || 'client';
  const role = parsedUser?.role;

  const titleElement = document.querySelector('title');

  if (role === 'admin') {
    titleElement.textContent = 'Admin';
  } else {
    titleElement.textContent = hotelname;
  }
</script>
  </body>
</html>
